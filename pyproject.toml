[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-library-boilerplate"
version = "1.0.0"
description = "Python Library Boilerplate is a production-ready starting point for building Python libraries from scratch."
requires-python = ">=3.11"
authors = [{name = "Diego Martin Libonati"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["template", "boilerplate", "library", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.3.0",
    "pip-audit==2.7.3",
    "ruff==0.11.12",
]
test = [
    "pytest==9.0.3",
    "pytest-env==1.1.5",
    "pytest-cov==4.1.0",
    "pytest-timeout==2.3.1",
    "pytest-xdist==3.5.0",
]

[project.scripts]
boilerplate-demo = "examples.demo:main"

[project.urls]
Homepage = "https://github.com/<owner>/Template-Library-Python"
Repository = "https://github.com/<owner>/Template-Library-Python"
Issues = "https://github.com/<owner>/Template-Library-Python/issues"
Changelog = "https://github.com/<owner>/Template-Library-Python/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["python_library_boilerplate*"]

[tool.setuptools.package-data]
python_library_boilerplate = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
log_cli = true
log_cli_level = "WARNING"
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.ruff]
line-length = 160
exclude = [".git", "__pycache__", "env", "venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "C4"]
ignore = ["E203"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
